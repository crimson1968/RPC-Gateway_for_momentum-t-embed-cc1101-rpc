services:
  tembed-gateway:
    build:
      context: /build/tembed-gateway
      dockerfile: Dockerfile
    image: tembed-gateway:local
    container_name: tembed-gateway
    restart: unless-stopped
    init: true
    command: ["--transport", "streamable-http"]
    environment:
      TEMBED_SERIAL: /dev/tembed
      TEMBED_URL: http://192.168.178.35
      MCP_ALLOWED_HOSTS: "tembed-gateway:8000,${NAS_LAN_IP:?Set NAS_LAN_IP in stack environment}:8787"
    ports:
      - "${NAS_LAN_IP:?Set NAS_LAN_IP in stack environment}:8787:8000"
    devices:
      - /dev/serial/by-id/usb-Flipper_Devices_Inc._Warp_FZESP32-if01:/dev/tembed:rw
    group_add:
      - '20'
    expose:
      - '8000'
    networks:
      - proxy
    labels:
      traefik.enable: 'false'
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  proxy:
    external: true
